# Local stand in for the AWS Application Load Balancer: routes by path,
# exactly like the ALB listener rules in production.
#   /api/search/*     -> search-service
#   /api/bookings/*   -> booking-service
#   /api/customers/*  -> customer-service
#   /api/documents/*  -> document-service
#   everything else   -> frontend
# /internal/* routes are never exposed through the gateway.

upstream search    { server search-service:8080; }
upstream booking   { server booking-service:8080; }
upstream customer  { server customer-service:8080; }
upstream document  { server document-service:8080; }
upstream frontend  { server frontend:80; }

server {
    listen 80;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /internal/       { return 404; }
    location /api/search/     { proxy_pass http://search; }
    location /api/bookings/   { proxy_pass http://booking; }
    location = /api/bookings  { proxy_pass http://booking; }
    location /api/customers/  { proxy_pass http://customer; }
    location = /api/customers { proxy_pass http://customer; }
    location /api/documents/  { proxy_pass http://document; }
    location = /api/documents { proxy_pass http://document; }
    location /                { proxy_pass http://frontend; }
}
