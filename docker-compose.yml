# Horizon Travel: the whole system on one machine.
#   docker compose up --build        then open http://localhost:8080
# Mirrors the AWS design: a gateway routes by path like the Application Load
# Balancer, Postgres stands in for RDS, Valkey for ElastiCache, a Redis list for
# SNS/SQS, and a shared folder for S3. Mock payments replace Stripe.

x-service-env: &service-env
  ENVIRONMENT: local
  DATABASE_URL: postgresql://horizon:horizon@postgres:5432/horizon
  REDIS_URL: redis://valkey:6379/0
  AUTH_MODE: dev
  EVENT_BACKEND: redis
  STORAGE_BACKEND: local
  LOCAL_STORAGE_DIR: /data/documents
  EMAIL_BACKEND: log
  PAYMENT_MODE: mock
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token-change-me}
  FRONTEND_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  SEARCH_SERVICE_URL: http://search-service:8080
  BOOKING_SERVICE_URL: http://booking-service:8080
  CUSTOMER_SERVICE_URL: http://customer-service:8080
  DOCUMENT_SERVICE_URL: http://document-service:8080

x-python-service: &python-service
  restart: unless-stopped
  environment: *service-env
  depends_on:
    migrate: { condition: service_completed_successfully }
    valkey: { condition: service_healthy }
  deploy:
    resources:
      limits: { memory: 256m }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
      POSTGRES_DB: horizon
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: ./db
    environment:
      DATABASE_URL: postgresql://horizon:horizon@postgres:5432/horizon
    depends_on:
      postgres: { condition: service_healthy }

  search-service:
    <<: *python-service
    build: { context: ./services, dockerfile: search-service/Dockerfile }

  booking-service:
    <<: *python-service
    build: { context: ./services, dockerfile: booking-service/Dockerfile }

  customer-service:
    <<: *python-service
    build: { context: ./services, dockerfile: customer-service/Dockerfile }

  document-service:
    <<: *python-service
    build: { context: ./services, dockerfile: document-service/Dockerfile }
    volumes: [documents:/data/documents]

  notification-worker:
    <<: *python-service
    build: { context: ./services, dockerfile: notification-worker/Dockerfile }
    volumes: [documents:/data/documents]

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: "/" }
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]
    depends_on: [frontend, search-service, booking-service, customer-service, document-service]
    restart: unless-stopped

volumes:
  pgdata:
  documents:
